<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Aliot PlantUML Editor marketplace icon</title>
  <desc id="description">Aliot four-ray star and connected grid, with the editor's warm yellow accent and a flat plant sprout badge for PlantUML.</desc>
  <defs>
    <linearGradient id="north" x1="256" y1="50" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d5a8"/><stop offset=".60" stop-color="#efbd83"/><stop offset="1" stop-color="#e5aa69"/>
    </linearGradient>
    <linearGradient id="south" x1="256" y1="398" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d5a8"/><stop offset=".60" stop-color="#efbd83"/><stop offset="1" stop-color="#e5aa69"/>
    </linearGradient>
    <linearGradient id="west" x1="74" y1="230" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d5a8"/><stop offset=".58" stop-color="#efbd83"/><stop offset="1" stop-color="#e5aa69"/>
    </linearGradient>
    <linearGradient id="east" x1="438" y1="230" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d5a8"/><stop offset=".58" stop-color="#efbd83"/><stop offset="1" stop-color="#e5aa69"/>
    </linearGradient>
    <linearGradient id="ring" x1="211" y1="178" x2="301" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9d6b37"/><stop offset=".44" stop-color="#bd884e"/><stop offset="1" stop-color="#9d6b37"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efbd83"/><stop offset="1" stop-color="#e5aa69"/>
    </linearGradient>
  </defs>
  <g id="symbol" transform="translate(256 256) scale(1.2) translate(-256 -230)">
    <!-- Preserve the shared Aliot star, grid, halo gaps and node proportions. -->
    <path d="M118 100H394V360H118Z M118 230H394" stroke="#d6dfec" stroke-width="4.3" stroke-linejoin="round"/>
    <circle cx="118" cy="100" r="18" fill="#e5aa69" fill-opacity=".13"/>
    <circle cx="118" cy="100" r="16" stroke="#e5aa69" stroke-width="2" stroke-opacity=".6"/>
    <circle cx="118" cy="100" r="12.5" fill="url(#node)"/>
    <circle cx="394" cy="100" r="18" fill="#e5aa69" fill-opacity=".13"/>
    <circle cx="394" cy="100" r="16" stroke="#e5aa69" stroke-width="2" stroke-opacity=".6"/>
    <circle cx="394" cy="100" r="12.5" fill="url(#node)"/>
    <circle cx="118" cy="360" r="18" fill="#e5aa69" fill-opacity=".13"/>
    <circle cx="118" cy="360" r="16" stroke="#e5aa69" stroke-width="2" stroke-opacity=".6"/>
    <circle cx="118" cy="360" r="12.5" fill="url(#node)"/>
    <g id="bottom-right-label-node" transform="translate(394 360)" aria-label="PlantUML">
      <circle id="label-node-aura" r="62" fill="#e5aa69" fill-opacity=".13"/>
      <circle id="label-node-outline" r="59" stroke="#e5aa69" stroke-width="2" stroke-opacity=".6"/>
      <circle id="label-node-fill" r="54" fill="url(#node)"/>
      <g id="plantuml-symbol" fill="#ffffff" aria-label="Plant sprout">
        <path d="M-3-5H3V28C3 32-3 32-3 28Z"/>
        <path d="M0 5C-19 7-32-6-31-25C-12-25 1-13 0 5Z"/>
        <path d="M0-2C-2-22 11-35 31-33C33-13 20 1 0-2Z"/>
      </g>
    </g>
    <g id="rays">
      <path d="M256 50L294 230H218Z" fill="url(#north)"/>
      <path d="M256 398L218 230H294Z" fill="url(#south)"/>
      <path d="M74 230L256 192V268Z" fill="url(#west)"/>
      <path d="M438 230L256 268V192Z" fill="url(#east)"/>
    </g>
    <circle id="aliot-ring" cx="256" cy="230" r="61" fill="url(#ring)"/>
    <circle id="white-centre" cx="256" cy="230" r="44.5" fill="#ffffff"/>
  </g>
</svg>
